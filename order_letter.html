<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่พบเอกสารคำสั่งซื้อ - Purrfect Shop</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Prompt:wght@300;400;500;600;700;800&family=Sarabun:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --cert-gold: #C59B27;
            --cert-gold-dark: #8C6D1F;
            --cert-gold-light: #FBF6E9;
            --cert-navy: #1A2B49;
            --cert-border: #D4AF37;
        }

        body {
            background: #F4F6F9;
            font-family: 'Sarabun', 'Prompt', sans-serif;
            color: #2D3748;
            margin: 0;
            padding: 20px 10px;
        }

        .cert-outer-wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-print {
            background: linear-gradient(135deg, #FF7556, #E05335);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(255, 117, 86, 0.35);
        }
        .btn-print:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 117, 86, 0.45);
        }

        .btn-back {
            background: #EDF2F7;
            color: #4A5568;
        }
        .btn-back:hover {
            background: #E2E8F0;
            color: #1A202C;
        }

        /* Certificate Paper Styling */
        .cert-paper {
            background: #FFFFFF;
            border: 12px double var(--cert-gold);
            border-radius: 4px;
            padding: 40px 48px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .cert-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8rem;
            font-weight: 900;
            color: rgba(197, 155, 39, 0.04);
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
        }

        .cert-header {
            text-align: center;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        .cert-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--cert-gold);
            padding: 3px;
            margin-bottom: 12px;
        }

        .cert-cattery-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--cert-navy);
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        .cert-cattery-sub {
            font-size: 0.95rem;
            color: var(--cert-gold-dark);
            font-weight: 600;
            margin-top: 4px;
        }

        .cert-doc-name {
            font-size: 1.45rem;
            font-weight: 700;
            color: #C0392B;
            margin-top: 16px;
            letter-spacing: 0.5px;
            padding: 6px 20px;
            display: inline-block;
            background: #FFF5F5;
            border: 1px dashed #E53E3E;
            border-radius: 8px;
        }

        .cert-meta-bar {
            display: flex;
            justify-content: space-between;
            background: var(--cert-gold-light);
            border: 1px solid rgba(197, 155, 39, 0.35);
            border-radius: 8px;
            padding: 12px 20px;
            margin: 24px 0;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .cert-meta-item strong {
            color: var(--cert-navy);
        }

        .cert-body {
            position: relative;
            z-index: 2;
            line-height: 1.75;
            font-size: 1rem;
            color: #334155;
        }

        .cert-greeting {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--cert-navy);
            margin-bottom: 12px;
        }

        .cert-intro-p {
            margin-bottom: 20px;
            text-align: justify;
        }

        .info-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin: 20px 0;
        }

        .info-box {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 16px;
        }

        .info-box-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--cert-navy);
            border-bottom: 1.5px solid #E2E8F0;
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box p {
            margin: 4px 0;
            font-size: 0.9rem;
        }

        /* Adopted Cats Section */
        .cats-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            overflow: hidden;
        }

        .cats-table th {
            background: #1E293B;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 12px 14px;
            text-align: left;
        }

        .cats-table td {
            padding: 14px;
            border-bottom: 1px solid #E2E8F0;
            vertical-align: middle;
            font-size: 0.92rem;
        }

        .cat-thumb {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            object-fit: cover;
            border: 1.5px solid #CBD5E1;
        }

        /* Health & Safety Guarantee Banner */
        .guarantee-box {
            background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
            border: 1.5px solid #86EFAC;
            border-radius: 10px;
            padding: 18px 22px;
            margin: 24px 0;
        }

        .guarantee-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #166534;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .guarantee-list {
            margin: 0;
            padding-left: 20px;
            font-size: 0.9rem;
            color: #14532D;
            line-height: 1.6;
        }

        /* Signatures and Official Seal */
        .cert-footer {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 2px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
            gap: 24px;
        }

        .official-seal {
            width: 130px;
            height: 130px;
            border: 4px dashed var(--cert-gold);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--cert-gold-dark);
            font-weight: 800;
            font-size: 0.72rem;
            text-transform: uppercase;
            padding: 8px;
            background: rgba(197, 155, 39, 0.05);
            transform: rotate(-8deg);
            box-shadow: 0 0 0 4px rgba(197, 155, 39, 0.15);
        }

        .seal-star {
            font-size: 1.2rem;
            color: var(--cert-gold);
            margin: 2px 0;
        }

        .signature-block {
            text-align: center;
            min-width: 220px;
        }

        .signature-line {
            width: 180px;
            height: 1px;
            background: #475569;
            margin: 12px auto 6px auto;
        }

        .signature-name {
            font-weight: 700;
            color: #0F172A;
            font-size: 0.95rem;
        }

        .signature-title {
            font-size: 0.82rem;
            color: #64748B;
        }

        /* Print Media Styles */
        @media print {
            body {
                background: #FFFFFF !important;
                padding: 0 !important;
                color: #000000 !important;
            }
            .action-bar, .no-print {
                display: none !important;
            }
            .cert-paper {
                box-shadow: none !important;
                border: 4px solid var(--cert-gold) !important;
                padding: 24px 30px !important;
            }
            .cert-outer-wrap {
                max-width: 100% !important;
                width: 100% !important;
            }
        }

        @media (max-width: 640px) {
            .cert-paper {
                padding: 20px 16px;
                border-width: 6px;
            }
            .cert-cattery-title {
                font-size: 1.35rem;
            }
            .cert-doc-name {
                font-size: 1.05rem;
            }
            .cert-footer {
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="cert-outer-wrap">
    <!-- Top Action Toolbar -->
    <div class="action-bar no-print">
        <div style="display: flex; align-items: center; gap: 10px;">
            <a href="index.html#profile" class="btn-action btn-back">
                &larr; กลับหน้ารายการสั่งซื้อ
            </a>
                    </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="window.print()" class="btn-action btn-print">
                🖨️ พิมพ์เอกสาร / ดาวน์โหลดเป็น PDF
            </button>
        </div>
    </div>

            <div class="cert-paper" style="text-align: center; padding: 60px 20px;">
            <div style="font-size: 4rem; margin-bottom: 12px;">📄</div>
            <h2 style="color: #E53E3E; margin-bottom: 8px;">ไม่พบเอกสารยืนยันคำสั่งซื้อ</h2>
            <p style="color: #64748B; margin-bottom: 24px;">ไม่พบรหัสคำสั่งจองที่ระบุ หรือเอกสารอาจยังไม่ได้ถูกสร้างในระบบ</p>
            <a href="index.html#profile" class="btn-action btn-back">กลับไปตรวจสอบประวัติคำสั่งซื้อ</a>
        </div>
    </div>

</body>
</html>
